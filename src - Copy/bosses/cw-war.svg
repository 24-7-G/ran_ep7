<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="steel" x1="20" y1="10" x2="108" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4fbff"/><stop offset=".45" stop-color="#9eb7c5"/><stop offset="1" stop-color="#4b6472"/>
    </linearGradient>
    <linearGradient id="gold" x1="20" y1="18" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0a3"/><stop offset=".5" stop-color="#d5a62e"/><stop offset="1" stop-color="#76500d"/>
    </linearGradient>
    <linearGradient id="phoenix" x1="15" y1="0" x2="45" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffcf62"/><stop offset="1" stop-color="#b72b38"/>
    </linearGradient>
    <linearGradient id="gate" x1="48" y1="0" x2="70" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dff7ff"/><stop offset="1" stop-color="#247db3"/>
    </linearGradient>
    <linearGradient id="peaks" x1="75" y1="0" x2="110" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9d4ff"/><stop offset="1" stop-color="#654fb1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="58" fill="#06131d" stroke="#163f55" stroke-width="3"/>
  <circle cx="64" cy="64" r="51" stroke="url(#gold)" stroke-width="2" opacity=".7"/>

  <!-- Three guild/faction shields: Phoenix / Sacred Gate / Mystical Peaks -->
  <path d="M18 18h24v20c0 10-6 16-12 20-6-4-12-10-12-20V18z" fill="url(#phoenix)" stroke="#f4d477" stroke-width="2"/>
  <path d="M52 13h24v24c0 10-6 16-12 20-6-4-12-10-12-20V13z" fill="url(#gate)" stroke="#d9f5ff" stroke-width="2"/>
  <path d="M86 18h24v20c0 10-6 16-12 20-6-4-12-10-12-20V18z" fill="url(#peaks)" stroke="#e0d8ff" stroke-width="2"/>

  <!-- simplified faction marks -->
  <path d="M24 33c4-8 8-10 12-12-1 5-1 8 2 11-5-2-9 0-14 5 1-2 1-3 0-4z" fill="#fff5cc" opacity=".95"/>
  <path d="M58 35V24h12v11M55 36h18" stroke="#f7ffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M91 37l7-10 7 10-7-4-7 4z" fill="#f5f2ff"/>

  <!-- crossed war blades -->
  <g filter="url(#glow)">
    <path d="M25 83L52 52l7 7-25 31-10 5 1-12z" fill="url(#steel)" stroke="#d7e9f2" stroke-width="1.5"/>
    <path d="M103 83L76 52l-7 7 25 31 10 5-1-12z" fill="url(#steel)" stroke="#d7e9f2" stroke-width="1.5"/>
    <path d="M45 72l-8 8M83 72l8 8" stroke="#d8a82e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- central guild-war crest -->
  <path d="M64 49l18 13v20c0 12-8 19-18 25-10-6-18-13-18-25V62l18-13z" fill="#071a26" stroke="url(#gold)" stroke-width="3"/>
  <path d="M64 57l10 8v14c0 7-4 11-10 15-6-4-10-8-10-15V65l10-8z" fill="#0b3145" stroke="#27caff" stroke-width="2"/>
  <path d="M59 73h10M64 68v16" stroke="#f0d15c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="3" fill="#ffffff"/>
</svg>
